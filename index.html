<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3ef" />
  <meta name="description" content="Sue's curated AI resource library" />
  <title>AI Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles-v2.css?v=20261120-1" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="AI Library 首页">
      <span class="brand-mark">S</span>
      <span class="brand-text"><b>AI Library</b><small>sue1231511 / skills-repository</small></span>
    </a>
    <a class="github-link" href="https://github.com/sue1231511/skills-repository" target="_blank" rel="noreferrer">GitHub ↗</a>
  </header>
  <main class="page-shell">
    <section class="intro">
      <div class="intro-copy">
        <p class="kicker">CURATED AI / 2026</p>
        <h1>AI 资源收集与整理</h1>
        <p class="intro-note">收集值得留下的 Skills、工具、Prompt、项目与视觉资源。</p>
      </div>
      <div class="intro-meta" id="stats"></div>
    </section>
    <section class="control-bar" aria-label="Skill 控制栏">
      <label class="search-box" for="searchInput">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索名称、用途、标签" />
        <kbd>/</kbd>
      </label>
      <div class="control-actions">
        <button id="favoriteToggle" class="control-btn" type="button">☆ 收藏</button>
        <button id="cartToggle" class="cart-btn" type="button" aria-label="打开待选区">待选 <span id="cartCount" class="cart-count">0</span></button>
        <select id="sortSelect" class="sort-select" aria-label="排序"><option value="default">默认排序</option><option value="az">名称 A–Z</option><option value="recent">最近访问</option></select>
      </div>
    </section>
    <div class="search-hint" id="searchHint" hidden></div>
    <section class="library-layout">
      <aside class="sidebar" aria-label="分类"><div class="sidebar-title">分类</div><nav id="categoryNav" class="category-nav"></nav></aside>
      <section class="library-content"><div id="grid" class="skill-grid" aria-live="polite"></div><div id="empty" class="empty" hidden><strong>没搜到</strong><span>换个词。别跟搜索框较劲。</span></div><div class="load-more-wrap"><button id="loadMoreBtn" class="load-more-btn" type="button">加载更多</button></div></section>
    </section>
  </main>
  <div id="cartBackdrop" class="cart-backdrop"></div>
  <aside id="cartDrawer" class="cart-drawer" aria-label="待选区">
    <div class="cart-head">
      <div>
        <span class="cart-kicker">待选区 / CART</span>
        <h3>已选 <b id="cartTotal">0</b> 个 Skill</h3>
      </div>
      <button id="cartClose" class="dialog-close" type="button" aria-label="关闭待选区">×</button>
    </div>
    <div id="cartList" class="cart-list"></div>
    <div id="cartEmpty" class="cart-empty">购物车还是空的。点击卡片上的「+ 待选」把 Skill 放进来，攒好后一起导出。</div>
    <div class="cart-foot">
      <div class="cart-actions">
        <button id="cartAddAll" class="mini-btn" type="button">加入当前搜索结果</button>
        <button id="cartClear" class="mini-btn danger" type="button">清空待选</button>
      </div>
      <label class="cart-format">导出格式
        <select id="cartFormat"><option value="detail">Agent Prompt（含简介）</option><option value="plain">纯名称 + 链接</option></select>
      </label>
      <textarea id="cartPrompt" class="cart-prompt" spellcheck="false" placeholder="选好 Skill 后，这里会生成可复制的 Prompt 或链接清单…"></textarea>
      <button id="cartCopy" class="cart-copy" type="button">复制导出内容</button>
    </div>
  </aside>
  <dialog id="detailDialog" class="detail-dialog"><button id="closeDialog" class="dialog-close" aria-label="关闭">×</button><div id="dialogContent"></div></dialog>
  <footer class="footer"><span>AI Library</span><span>Curated from the repository.</span></footer>
  <script src="./app.js?v=20261120-1"></script>
</body>
</html>
